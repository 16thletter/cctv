<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV People Counter Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .stat-label {
            color: #666;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-card.in .stat-value {
            color: #10b981;
        }
        
        .stat-card.out .stat-value {
            color: #ef4444;
        }
        
        .stat-card.occupancy .stat-value {
            color: #3b82f6;
        }
        
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .last-update {
            color: white;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin: 50px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 CCTV People Counter Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card in">
                <div class="stat-label">People In</div>
                <div class="stat-value" id="count-in">0</div>
            </div>
            
            <div class="stat-card out">
                <div class="stat-label">People Out</div>
                <div class="stat-value" id="count-out">0</div>
            </div>
            
            <div class="stat-card occupancy">
                <div class="stat-label">Current Occupancy</div>
                <div class="stat-value" id="occupancy">0</div>
            </div>
        </div>
        
        <div class="chart-container">
            <div id="hourly-chart"></div>
        </div>
        
        <div class="last-update">
            Last updated: <span id="last-update">Never</span>
        </div>
    </div>
    
    <script>
        // Update current statistics
        async function updateStats() {
            try {
                const response = await fetch('/api/current');
                const data = await response.json();
                
                document.getElementById('count-in').textContent = data.count_in;
                document.getElementById('count-out').textContent = data.count_out;
                document.getElementById('occupancy').textContent = data.occupancy;
                
                if (data.last_update) {
                    const date = new Date(data.last_update);
                    document.getElementById('last-update').textContent = date.toLocaleString();
                }
            } catch (error) {
                console.error('Error updating stats:', error);
            }
        }
        
        // Update hourly chart
        async function updateChart() {
            try {
                const response = await fetch('/api/hourly?hours=24');
                const data = await response.json();
                
                const hours = data.map(d => d.hour);
                const inCounts = data.map(d => d.in);
                const outCounts = data.map(d => d.out);
                
                const trace1 = {
                    x: hours,
                    y: inCounts,
                    name: 'People In',
                    type: 'bar',
                    marker: { color: '#10b981' }
                };
                
                const trace2 = {
                    x: hours,
                    y: outCounts,
                    name: 'People Out',
                    type: 'bar',
                    marker: { color: '#ef4444' }
                };
                
                const layout = {
                    title: 'Hourly Traffic (Last 24 Hours)',
                    barmode: 'group',
                    xaxis: { title: 'Hour' },
                    yaxis: { title: 'Count' },
                    height: 400
                };
                
                Plotly.newPlot('hourly-chart', [trace1, trace2], layout);
            } catch (error) {
                console.error('Error updating chart:', error);
            }
        }
        
        // Initial load
        updateStats();
        updateChart();
        
        // Auto-refresh every 5 seconds
        setInterval(updateStats, 5000);
        setInterval(updateChart, 30000);
    </script>
</body>
</html>
