camera:
  source: rtsp://admin:BEST@@INFO@60.254.111.210:555/stream1
  width: 1280
  height: 720
  fps: 30
counting_line:
  outside_line:
  - 0.2
  - 0.51
  - 0.8
  - 0.51
  inside_line:
  - 0.2
  - 0.5800000000000001
  - 0.8
  - 0.5800000000000001
  color:
  - 0
  - 255
  - 0
  cooldown_frames: 75
  in_direction: down
  min_track_length: 5
  thickness: 3
database:
  enabled: true
  log_events: true
  path: people_counter.db
detection:
  classes:
  - 0
  confidence: 0.4
  device: cpu
  imgsz: 480
  model: yolov8n.pt
display:
  output_path: output/output.avi
  save_output: false
  show_counts: true
  show_detections: true
  show_tracks: true
  show_trails: true
  show_video: true
  trail_length: 30
logging:
  console: true
  file: logs/app.log
  level: INFO
processing:
  num_threads: 4
  roi_coordinates:
  - 0
  - 0
  - 1
  - 1
  roi_enabled: false
  skip_frames: 2
tracking:
  iou_threshold: 0.2
  max_age: 60  # Increased from 40 to handle more missed frames (2 seconds at 30fps)
  min_hits: 1
