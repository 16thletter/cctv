# Camera Configuration
# ============================================================================
# CAMERA CONFIGURATION
# ============================================================================
# IMPORTANT: Camera RTSP URLs should be stored in .env file for security
# Example .env file:
#   CAMERA_MAIN_URL=rtsp://admin:password@192.168.1.100:554/stream1
#   CAMERA_ENTRANCE_URL=rtsp://admin:password@192.168.1.101:554/stream1
#   CAMERA_EXIT_URL=rtsp://admin:password@192.168.1.102:554/stream1

# For single camera mode, use 'camera' section
camera:
  id: main  # Camera identifier for multi-camera setup
  source_env: CAMERA_MAIN_URL  # Environment variable name containing RTSP URL
  organization_id: null  # Optional: Organization ID this camera belongs to
  location: Main Entrance  # Human-readable location
  width: 1280
  height: 720
  fps: 30

# Multi-Camera Configuration (Optional - for multiple cameras)
# Each camera can belong to a different organization
# cameras:
#   entrance:
#     id: entrance
#     source_env: CAMERA_ENTRANCE_URL  # Environment variable for RTSP URL
#     organization_id: 1  # Organization ID (e.g., Company A)
#     location: Main Entrance
#     counting_line:
#       outside_line: [0.35, 0.52, 0.65, 0.52]
#       inside_line: [0.35, 0.58, 0.65, 0.58]
#       in_direction: down
#
#   exit:
#     id: exit
#     source_env: CAMERA_EXIT_URL  # Environment variable for RTSP URL
#     organization_id: 1  # Organization ID (e.g., Company A)
#     location: Main Exit
#     counting_line:
#       outside_line: [0.35, 0.50, 0.65, 0.50]
#       inside_line: [0.35, 0.56, 0.65, 0.56]
#       in_direction: up
#
#   lobby_companyB:
#     id: lobby_companyB
#     source_env: CAMERA_LOBBY_B_URL  # Environment variable for RTSP URL
#     organization_id: 2  # Organization ID (e.g., Company B)
#     location: Company B Lobby
#     counting_line:
#       outside_line: [0.30, 0.50, 0.70, 0.50]
#       inside_line: [0.30, 0.56, 0.70, 0.56]
#       in_direction: down
#
#   lobby:
#     id: lobby
#     source: rtsp://admin:password@192.168.1.103/stream1
#     location: Lobby Area
#     counting_line:
#       outside_line: [0.30, 0.55, 0.70, 0.55]
#       inside_line: [0.30, 0.61, 0.70, 0.61]
#       in_direction: down
counting_line:
  outside_line:
  - 0.35  # Left edge of door (35% from left)
  - 0.52  # Y position (52% from top)
  - 0.65  # Right edge of door (65% from left)
  - 0.52  # Y position (same as start - horizontal line)
  inside_line:
  - 0.35  # Must match outside_line X coordinates
  - 0.58  # Y position (58% from top) - Original transition zone (6% gap)
  - 0.65  # Must match outside_line X coordinates
  - 0.58  # Y position (same as start - horizontal line)
  color:
  - 0
  - 255
  - 0
  cooldown_frames: 75
  in_direction: down
  min_track_length: 5
  thickness: 3
# PostgreSQL Database Configuration (NEW - Face Recognition)
database:
  enabled: true
  log_events: true
  # PostgreSQL settings
  type: postgresql  # 'postgresql' or 'sqlite' (legacy)
  host: localhost
  port: 5432
  database: face_recognition
  user: postgres
  password: your_password_here
  # Legacy SQLite (will be deprecated)
  path: people_counter.db

# Face Recognition Configuration (NEW - InsightFace + ArcFace)
face_recognition:
  enabled: true
  model: insightface  # Using InsightFace with ArcFace embeddings
  providers:
    - CUDAExecutionProvider  # GPU (comment out if CPU only)
    - CPUExecutionProvider
  det_size: [640, 640]  # Detection size (larger = more accurate but slower)
  confidence_threshold: 0.6  # Face matching threshold (0.0-1.0)
  min_face_size: 50  # Minimum face size in pixels
  max_faces_per_frame: 10  # Maximum faces to process per frame
  save_snapshots: true  # Save face snapshots on detection
  snapshot_dir: snapshots/faces
detection:
  classes:
  - 0
  confidence: 0.3  # Lowered from 0.4 to detect people further away (outside zone)
  device: cpu
  imgsz: 480
  model: yolov8n.pt
display:
  output_path: output/output.avi
  save_output: false
  show_counts: true
  show_detections: true
  show_tracks: true
  show_trails: true
  show_video: true
  trail_length: 30
logging:
  console: true
  file: logs/app.log
  level: INFO
processing:
  num_threads: 4
  roi_coordinates:
  - 0
  - 0
  - 1
  - 1
  roi_enabled: false
  skip_frames: 2
tracking:
  iou_threshold: 0.3  # Increased for better multi-person matching
  max_age: 90  # Increased from 60 to keep tracks longer (3 seconds at 30fps)
  min_hits: 1
  track_high_thresh: 0.4  # Lowered from 0.5 to detect people further away
  track_low_thresh: 0.05  # Lowered from 0.1 for better recovery
  new_track_thresh: 0.4  # Lowered from 0.5 to create tracks more easily
  track_buffer: 45  # Increased from 30 to recover lost tracks longer
